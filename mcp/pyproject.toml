[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neport-mcp"
version = "0.1.0"
description = "Purpose-oriented MCP server for the Neport REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neport contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
neport-mcp = "neport_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["neport_mcp"]
