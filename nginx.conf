user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Large enough for a full backup restore upload (backend/src/backup),
    # not just the 8MB attachment cap that most other endpoints need.
    client_max_body_size 200M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-js text/x-component text/x-cross-domain-policy;

    # Trust an upstream edge proxy's X-Forwarded-Proto (e.g. a Let's Encrypt-
    # terminating reverse proxy in front of this container); fall back to the
    # scheme of the request as seen by this nginx when absent.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        # docker-composeでは常に80(nginx.confのデフォルト値)。Cloud Runは
        # PORT環境変数(既定8080)でリッスンさせようとするため、
        # frontend/docker-entrypoint.shがenvsubstでここを実際の値に置き換える
        # (backend側のPORT対応はbackend/src/config.rs参照)。
        listen ${PORT};
        listen [::]:${PORT};
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # API proxy
        # ^~ stops nginx from falling through to the static-asset regex
        # location below for paths like /api/v1/attachments/<hash>.png -
        # without it, a request whose path happens to end in .png/.jpg/etc
        # would be matched by that regex location instead of being proxied
        # here, since nginx prefers a matching regex location over a plain
        # prefix one.
        location ^~ /api/ {
            # ${BACKEND_UPSTREAM} is substituted by envsubst (see
            # frontend/docker-entrypoint.sh) into a literal URL before nginx
            # starts, so this is a static proxy_pass target - nginx resolves
            # it once via the OS resolver at startup/reload, same as any
            # ordinary hostname. Deliberately NOT using an nginx variable
            # here (e.g. `set $backend_upstream ...; proxy_pass
            # $backend_upstream;`): that defers resolution to every request
            # via an explicit `resolver` directive, which is unnecessary
            # complexity for a target that's fixed for the container's
            # entire lifetime anyway. (The actual bug that made
            # backend-to-backend calls fail intermittently - 400/404/429/502
            # depending on the moment - turned out to be the Host header
            # below, not the resolver; see that comment.)
            proxy_pass ${BACKEND_UPSTREAM};
            # SNI for an HTTPS backend (e.g. Cloud Run's own *.run.app URL);
            # harmless no-op against docker-compose's plain-HTTP backend.
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            # NOT $host: that's the frontend's own Host as seen by the
            # client, and forwarding it to a backend that's itself a Cloud
            # Run *.run.app service confuses Google's edge routing (which
            # keys off Host/SNI to pick the target service) - SNI correctly
            # names the backend (proxy_ssl_server_name above) while Host
            # named the frontend instead, a mismatch that surfaced as
            # inconsistent 400/404/429/502 depending on Google's edge
            # behavior at the time. $proxy_host is nginx's own default when
            # this directive is omitted entirely and is always correct here
            # (backend doesn't read/depend on the Host header itself).
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_cookie_path / "/";
            proxy_cookie_flags ~ secure httponly samesite=lax;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # Static assets (long cache)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
