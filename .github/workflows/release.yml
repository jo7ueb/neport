name: Release Neport

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build pytest
      - run: python -m pip install --editable mcp
      - run: PYTHONPATH=mcp python -m pytest -q mcp/tests
      - run: python -m build mcp
      - name: Create downloadable MCP zip
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("mcp/pyproject.toml", "rb"))["project"]["version"])')
          mkdir -p release
          # Keep the PEP 427 wheel filename generated by `python -m build`.
          # In particular, the normalized distribution name uses `_`, not `-`.
          cp mcp/dist/neport_mcp-${version}-py3-none-any.whl "release/neport_mcp-${version}-py3-none-any.whl"
          zip -qr "release/neport-mcp-${version}.zip" mcp \
            -x 'mcp/.pytest_cache/*' 'mcp/**/__pycache__/*' 'mcp/dist/*'
      - name: Create repository tarball
        shell: bash
        run: |
          git archive --format=tar.gz --prefix="neport-${GITHUB_REF_NAME}/" \
            --output="release/neport-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
